<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">WPO — Web Panel Online</title>
  <desc id="desc">Белые буквы WP и синяя светящаяся O на тёмном фоне.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132238"/>
      <stop offset="1" stop-color="#081321"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#70b2ff"/>
      <stop offset=".48" stop-color="#438dff"/>
      <stop offset="1" stop-color="#2468e8"/>
    </linearGradient>
    <filter id="blue-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.16 0 0 0 0 0.43 0 0 0 0 1 0 0 0 0.8 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="4" y="4" width="248" height="248" rx="58" fill="url(#background)" stroke="#29476d" stroke-width="3"/>
  <text x="25" y="161" font-family="Arial, Helvetica, sans-serif" font-size="91" font-weight="700" letter-spacing="-7" fill="#f3f6fc">WP</text>
  <text x="165" y="161" font-family="Arial, Helvetica, sans-serif" font-size="91" font-weight="700" fill="url(#blue)" filter="url(#blue-glow)">O</text>
</svg>
