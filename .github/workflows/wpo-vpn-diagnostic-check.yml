name: WPO VPN diagnostics syntax
on:
  push:
    branches:
      - test/wpo-vpn-diagnostic-20261112
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify diagnostic is read-only and syntactically valid
        shell: bash
        run: |
          set -euo pipefail
          sh -n wpo-vpn-diagnostic.sh
          python3 - <<'PY'
          import ast
          from pathlib import Path
          s=Path('wpo-vpn-diagnostic.sh').read_text(encoding='utf-8')
          marker="python3 - <<'PY'\n"
          assert s.count(marker)==1
          text=s.split(marker,1)[1]
          assert text.endswith('\nPY\n')
          ast.parse(text[:-4])
          for forbidden in ['systemctl restart','systemctl stop','systemctl enable','nft add','nft delete','ufw allow','ufw delete','apt-get','rm -rf','os.unlink','os.remove']:
              assert forbidden not in s,forbidden
          print('READ ONLY / syntax: PASS')
          PY
