name: Align v3.0.0 with the exact first-version logo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/align-logo-tag.yml"

permissions:
  contents: write

jobs:
  align-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move v3.0.0 to the immediately preceding commit
        run: |
          set -euo pipefail
          target="$(git rev-parse HEAD^)"
          git push origin "${target}:refs/tags/v3.0.0" --force
