name: Point WPO 3.0.0 release tag to the original logo asset

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-wpo-tag.yml"

permissions:
  contents: write

jobs:
  update-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move release tag to the immediately preceding commit
        run: |
          set -euo pipefail
          target="$(git rev-parse HEAD^)"
          git push origin "${target}:refs/tags/v3.0.0" --force
