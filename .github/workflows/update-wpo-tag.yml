name: Point WPO 3.0.0 release tag to the refreshed README and logo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-wpo-tag.yml"

permissions:
  contents: write

jobs:
  move-release-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update v3.0.0 tag to the preceding commit
        run: |
          set -euo pipefail
          target="$(git rev-parse HEAD^)"
          git push origin "${target}:refs/tags/v3.0.0" --force
