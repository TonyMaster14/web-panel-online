name: Restore original WPO logo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-wpo-logo.yml"

permissions:
  contents: write

jobs:
  restore-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render WPO icon
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check Pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          from pathlib import Path

          size = 512
          base = Image.new("RGBA", (size, size), (10, 17, 27, 255))

          # Subtle navy gradient inside the rounded-square mark.
          gradient = Image.new("RGBA", (size, size), (0, 0, 0, 0))
          px = gradient.load()
          for y in range(size):
              for x in range(size):
                  t = max(0.0, min(1.0, (0.75 * (1 - y / size) + 0.25 * (x / size))))
                  px[x, y] = (
                      int(10 + 8 * t),
                      int(19 + 12 * t),
                      int(32 + 20 * t),
                      255,
                  )

          mask = Image.new("L", (size, size), 0)
          md = ImageDraw.Draw(mask)
          md.rounded_rectangle((7, 7, 505, 505), radius=126, fill=255)
          base.alpha_composite(Image.composite(gradient, Image.new("RGBA", (size, size)), mask))

          # Outer edge, like the original dark-blue app icon.
          edge = Image.new("RGBA", (size, size), (0, 0, 0, 0))
          ed = ImageDraw.Draw(edge)
          ed.rounded_rectangle(
              (7, 7, 505, 505),
              radius=126,
              outline=(39, 68, 101, 255),
              width=8,
          )
          base.alpha_composite(edge)

          font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          font = ImageFont.truetype(font_path, 151)
          probe = ImageDraw.Draw(Image.new("RGB", (1, 1)))
          wp_box = probe.textbbox((0, 0), "WP", font=font, stroke_width=0)
          o_box = probe.textbbox((0, 0), "O", font=font, stroke_width=0)
          wp_w = wp_box[2] - wp_box[0]
          o_w = o_box[2] - o_box[0]
          gap = -7
          total_w = wp_w + gap + o_w
          start_x = (size - total_w) // 2
          text_h = max(wp_box[3] - wp_box[1], o_box[3] - o_box[1])
          y = (size - text_h) // 2 - wp_box[1]

          # Blue bloom behind the O.
          glow = Image.new("RGBA", (size, size), (0, 0, 0, 0))
          gd = ImageDraw.Draw(glow)
          ox = start_x + wp_w + gap
          gd.text((ox, y), "O", font=font, fill=(45, 126, 255, 220))
          base.alpha_composite(glow.filter(ImageFilter.GaussianBlur(27)))
          base.alpha_composite(glow.filter(ImageFilter.GaussianBlur(12)))

          # Crisp white WP and luminous blue O.
          letters = Image.new("RGBA", (size, size), (0, 0, 0, 0))
          ld = ImageDraw.Draw(letters)
          ld.text((start_x, y), "WP", font=font, fill=(246, 248, 253, 255))
          ld.text((ox, y), "O", font=font, fill=(61, 139, 255, 255))
          base.alpha_composite(letters)

          base.convert("RGB").save("panel-logo.png", "PNG", optimize=True)
          assert Image.open("panel-logo.png").format == "PNG"
          assert Image.open("panel-logo.png").size == (512, 512)
          print("Created panel-logo.png: 512x512 PNG")
          PY

      - name: Publish logo and align v3.0.0
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add panel-logo.png
          git commit -m "Restore original WPO app icon"
          git push origin HEAD:main
          git tag -f v3.0.0
          git push origin v3.0.0 --force

      - name: Remove this temporary workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/restore-wpo-logo.yml
          git commit -m "Remove temporary logo restoration workflow"
          git push origin HEAD:main
