name: WPO unified blue v26 preflight
on:
  push:
    branches:
      - test/wpo-3-unified-blue-v26
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax and Python sources
        shell: bash
        run: |
          set -Eeuo pipefail
          for script in install.sh install-final.sh install-webproxy-core.sh install-panel.sh node-install.sh wpo-happ-vless-title-v1.sh; do
            bash -n "$script"
          done
          python3 -m py_compile wpp_ui.py wpp_nodes.py wpp_routing.py wpp_subscriptions.py wpp_panel_extras.py
      - name: Test one masked password entry and immediate continuation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          source=Path('install.sh').read_text(encoding='utf-8')
          section=source.split('ask_password(){',1)[1].split('\n# Classic mode remains',1)[0]
          assert 'Повторите пароль' not in section, 'Second password prompt must be absent'
          assert section.count('read -r -s -p')==1, 'Password must be read only once'
          assert section.count('break')==1, 'Valid password must immediately continue'
          assert '$green' not in source, 'Undefined color variable in wizard'
          prelude="set -Eeuo pipefail\nstep(){ :; }\ngray=''\ncyan=''\nreset=''\nask_password(){"
          # A single newline must be enough for a valid password; a second read
          # would fail the test. The test never installs packages or contacts a VPS.
          script=prelude+section+"\nask_password\n[[ ${PASS} == 'TestPassword123' ]]\n"
          good=subprocess.run(['bash','-c',script],input='TestPassword123\n',text=True,capture_output=True,timeout=8)
          assert good.returncode==0, f'Single-password input unexpectedly failed: {good.stderr}'
          assert 'TestPassword123' not in good.stdout+good.stderr, 'Masked password leaked to terminal output'
          assert 'Повторите' not in good.stdout+good.stderr, 'Unexpected second input prompt'
          # A too-short password may be re-entered, but never confirmed twice.
          retry=subprocess.run(['bash','-c',script],input='ab\nTestPassword123\n',text=True,capture_output=True,timeout=8)
          assert retry.returncode==0 and 'минимум 3' in retry.stdout, 'Length guard or retry did not work'
          assert 'TestPassword123' not in retry.stdout+retry.stderr
          print('PASS: one hidden password accepted, no confirmation, short input retried, secret never echoed')
          PY
      - name: Real TTY masked password and immediate continuation smoke test
        shell: bash
        run: |
          python3 tests/test_installer_password_tty.py
      - name: Real TTY ordered wizard steps from Enter to installation
        shell: bash
        run: |
          python3 tests/test_installer_step_by_step.py
      - name: Russian final access card for fresh installs and upgrades
        shell: bash
        run: |
          python3 tests/test_installer_access_card.py
      - name: Milestone-only thick progress bar and real elapsed timer
        shell: bash
        run: |
          python3 tests/test_installer_progress.py
      - name: Run interactive installer TTY success and failure scenarios
        shell: bash
        run: |
          sudo -E python3 tests/test_installer_finish_tty.py
      - name: Verify bundled Node helpers replace remote downloads
        shell: bash
        run: |
          python3 tests/test_node_bundled_downloads.py
      - name: Simulate complete interactive install, success and failure in a real PTY
        shell: bash
        run: |
          sudo -E python3 tests/test_installer_wizard_integrated.py
      - name: Verify all 26 embedded stages, exact legacy files
        shell: bash
        run: |
          python3 - <<'PY'
          import re,subprocess,tempfile
          from pathlib import Path
          src=Path('node-install.sh').read_text(encoding='utf-8')
          pattern=re.compile(r'^cat > "\$STAGE/(?P<name>wpo-nodes-lab(?:-v\d+)?-install\.sh)" <<\x27(?P<mark>__WPO_EMBED_V\d+_END_736a4b__)\x27\n(?P<body>[\s\S]*?)\n(?P=mark)$', re.M)
          matches=list(pattern.finditer(src))
          assert len(matches)==26, f"Expected 26 embedded stages, got {len(matches)}"
          with tempfile.TemporaryDirectory() as td:
            for index,item in enumerate(matches,1):
              name='wpo-nodes-lab-install.sh' if index==1 else f'wpo-nodes-lab-v{index}-install.sh'
              assert item['name']==name, f'Order mismatch: {name}'
              actual=item['body'].rstrip('\n')+'\n'
              expected=Path(name).read_text(encoding='utf-8').rstrip('\n')+'\n'
              assert actual==expected, f'Embedded source mismatch: {name}'
              path=Path(td)/name
              path.write_text(actual,encoding='utf-8')
              subprocess.run(['bash','-n',str(path)],check=True)
          print('PASS: all 26 embedded sources are byte-equivalent and shell-valid')
          PY
      - name: Exercise VPN protocols, clients, Happ imports, routing and configuration transactions
        shell: bash
        run: |
          set -Eeuo pipefail
          for suite in test_connection_json.py test_direct_routing.py test_mieru_creation.py test_mieru_links.py test_mtproxy_download.py test_openflux_links.py test_timeweb_paths.py; do
            echo "=== $suite ==="
            python3 -m unittest discover -s tests -p "$suite" -v
          done
      - name: Verify installer safety, credentials, visual layout, restart and Happ title
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          boot=Path('install.sh').read_text()
          core=Path('install-webproxy-core.sh').read_text()
          final=Path('install-final.sh').read_text()
          panel=Path('install-panel.sh').read_text()
          node=Path('node-install.sh').read_text()
          ui=Path('wpp_ui.py').read_text()
          checks={
            'test branch pinned': 'test/wpo-3-unified-blue-v26' in boot,
            'blue wizard': 'МАСТЕР УСТАНОВКИ' in boot and '╭─' in boot,
            'no large button': 'УСТАНОВИТЬ' not in boot and 'ENTER — установить' in boot,
            'progress clock': 'elapsed/3600' in boot and 'elapsed%60' in boot and '◷ %02d:%02d:%02d' in boot,
            'private wizard credentials': 'mktemp /run/wpo-ui-credentials.' in boot and 'chmod 0600 "$CREDENTIALS"' in boot,
            'legacy VPN core pinned': 'TPROXY_REF="52a5feb7fac38f68da5afef9cedd9b3bfc8473ca"' in core,
            'core reads wizard credentials': 'WPO_UI_CREDENTIALS_FILE' in core,
            'core reports stages': 'wpo_emit_stage' in core,
            'password and token not logged': '} > "${WPO_UI_RESULT_FILE:-/dev/stdout}"' in panel,
            'final card contains Russian labels': all(label in panel for label in ("Ссылка на панель:", "Логин :", "Пароль :")),
            'final card excludes Node API token': 'NODE_API_TOKEN=' not in panel and '"Node API token:"' not in panel,
            'classic result file owned': 'WPO_FINAL_SUMMARY_OWNED=0' in final and 'WPO_FINAL_SUMMARY_OWNED=1' in final,
            'access card printed after completion': final.rfind('cat -- "$WPO_UI_RESULT_FILE"') > final.rfind('wpp_progress 100 "Установка завершена"'),
            'secured result file': 'mktemp /run/wpo-install-result.' in final and 'chmod 0600 "$WPO_UI_RESULT_FILE"' in final,
            'wizard only displays result on success': 'if (( code == 0 )); then' in boot and 'cat -- "$RESULT"' in boot,
            'one node install': 'bash "$BASE/node-install.sh"' in final and 'WPO_NODES_BATCH_RESTART=1' in final,
            'node failed start reset': 'systemctl reset-failed "$SERVICE"' in node,
            'node localhost health': '127.0.0.1:8090' in node,
            'Xray syntax and service checks': 'xray run -test -config' in final and 'web-panel-proxy-xray.service' in final,
            'Happ title without routing': '# wpo-happ-vless-title-v1' in ui and 'happ_url=direct_profile_url' in ui,
            'Happ node separate': 'direct_profile_config' in panel and '"profile-title"' in panel,
            'exact Russian three-field access card': all(t in panel for t in ("Ссылка на панель:", "Логин :", "Пароль :")) and "⚠ Сохраните данные, что бы не потерять!" in panel,
            'no node token in access card': 'echo "Node API token:"' not in panel and 'NODE_API_TOKEN=' not in panel,
          }
          for k,v in checks.items():
            print(('PASS' if v else 'FAIL')+' '+k)
          assert all(checks.values()), 'preflight invariants failed'
          PY
